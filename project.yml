name: uawake
options:
  bundleIdPrefix: com.underscoretec
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Ad-hoc signing for local builds; CI signs with Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  UAwakeCore:
    path: Packages/UAwakeCore
  UAwakeSystem:
    path: Packages/UAwakeSystem
  UAwakeIPC:
    path: Packages/UAwakeIPC
targets:
  uawake:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_NAME: uawake
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.underscoretec.uawake
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: uawake
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: "uawake checks whether a camera is in use, to keep your Mac awake during calls. It never records or views video."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "uawake checks which Bluetooth devices are connected, for rules that keep your Mac awake."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "macOS shares the Wi-Fi network name only with apps that have Location access. uawake uses the name for rules and never reads where you are."
        INFOPLIST_KEY_NSLocationUsageDescription: "macOS shares the Wi-Fi network name only with apps that have Location access. uawake uses the name for rules and never reads where you are."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "uawake checks whether a calendar event is in progress, for rules that keep your Mac awake. Events never leave your Mac."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Underscore Technology Pvt. Ltd. MIT licence."
        CODE_SIGN_ENTITLEMENTS: App/uawake.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: UAwakeCore
      - package: UAwakeSystem
      - package: UAwakeIPC
      - package: Sparkle
  uawakeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.underscoretec.uawakeTests
    dependencies:
      - target: uawake
      - package: UAwakeCore
        product: UAwakeCoreTesting
  uawakeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AppUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.underscoretec.uawakeUITests
        TEST_TARGET_NAME: uawake
    dependencies:
      - target: uawake
  # Developer tool, never shipped: see docs/SANDBOX-SPIKE.md.
  SandboxProbe:
    type: application
    platform: macOS
    sources:
      - path: Tools/SandboxProbe
        excludes: ["Agent/**", "LaunchAgents/**", "*.mobileconfig", "*.entitlements", "Info.plist"]
      - path: Tools/SandboxProbe/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: SandboxProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.underscoretec.uawake.SandboxProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tools/SandboxProbe/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tools/SandboxProbe/SandboxProbe.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: UAwakeCore
      - package: UAwakeSystem
      - target: SandboxProbeAgent
        embed: true
        copy:
          destination: executables
  SandboxProbeAgent:
    type: tool
    platform: macOS
    sources: [Tools/SandboxProbe/Agent]
    settings:
      base:
        PRODUCT_NAME: SandboxProbeAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.underscoretec.uawake.SandboxProbe.agent
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: Tools/SandboxProbe/Agent/Agent.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  SandboxProbe:
    build:
      targets:
        SandboxProbe: all
  uawake:
    build:
      targets:
        uawake: all
    test:
      targets: [uawakeTests]
  # UI tests need macOS to allow UI automation for Xcode's test runner: `make uitest`.
  uawakeUITests:
    build:
      targets:
        uawake: all
        uawakeUITests: [test]
    test:
      targets: [uawakeUITests]
